# Workspace-local build configuration.
#
# polyglot-mlir / polyglot-codegen link against the MLIR C API from a local
# LLVM 17.0.6 install. These env vars point mlir-sys (v220) at that install
# and give bindgen access to clang's builtin headers.
[env]
MLIR_SYS_220_PREFIX = "/home/jupyter-24b11cs489@adityau-1219b/llvm-install/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04"
BINDGEN_EXTRA_CLANG_ARGS = "-I/home/jupyter-24b11cs489@adityau-1219b/llvm-install/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/lib/clang/17/include"
