[workspace]
resolver = "2"
members = [
    "crates/polyglot-protocol",
    "crates/polyglot-driver",
    "crates/polyglot-mlir",
    "crates/polyglot-codegen",
    "crates/polyglot-cache",
    "crates/polyglot-registry",
    "plugins/polyglot-clang",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Polyglot Team"]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
target-lexicon = "0.12"

# MLIR / Codegen
mlir-sys = { version = "220", features = ["no-version-check"] }
cranelift = "0.92"
cranelift-codegen = "0.92"
cranelift-module = "0.92"
cranelift-object = "0.92"
cranelift-preopt = "0.92"

# Utilities
tempfile = "3.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }