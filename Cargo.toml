[workspace]
resolver = "2"
members = [
    "crates/polyglot-core",
    "crates/polyglot-syntax",
    "crates/polyglot-sema",
    "crates/polyglot-ir",
    "crates/polyglot-protocol",
    "crates/polyglot-codegen",
    "crates/polyglot-driver",
    "plugins/polyglot-clang",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Polyglot Team"]

[workspace.dependencies]
# Core
anyhow = "1.0"

# Polyglot compiler pipeline (in-repo crates used via inheritance)
polyglot-core = { path = "crates/polyglot-core", version = "0.1.0" }
polyglot-syntax = { path = "crates/polyglot-syntax", version = "0.1.0" }
polyglot-sema = { path = "crates/polyglot-sema", version = "0.1.0" }
polyglot-ir = { path = "crates/polyglot-ir", version = "0.1.0" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
target-lexicon = "0.12"

# Utilities
tempfile = "3.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.0", features = ["v4", "serde"] }
