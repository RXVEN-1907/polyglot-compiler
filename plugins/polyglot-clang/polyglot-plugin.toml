[plugin]
name = "clang"
version = "0.1.0"
description = "C/C++ frontend via Clang"
author = "Polyglot Team"
license = "MIT"

[protocol]
version = "0.1.0"
transport = "stdio"

[capabilities]
mlir_dialects = ["llvm", "affine", "arith", "func", "memref", "scf"]
source_extensions = ["c", "h", "cpp", "cc", "cxx", "hpp"]
languages = ["c", "c++"]

[build]
command = "polyglot-clang"