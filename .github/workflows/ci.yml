name: CI

# master is the default branch; main/develop are kept so both naming
# conventions are covered. workflow_dispatch allows manual runs.
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- Python --
  # Driver `polyglot` + the comprehensive integration suite.
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # rustc is one of the components `polyglot doctor --strict` audits.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 clang-format-17 clang-tidy-17 \
            llvm-17 lld-17

      # The driver self-discovers toolchains here (clang, opt, llc, lli,
      # llvm-mca, wasm-ld, ... all live in this dir on Debian/Ubuntu).
      - name: Prepend LLVM 17 bin dir to PATH
        run: echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python3 -m pip install toml pytest

      - name: Make polyglot executable
        run: chmod +x polyglot

      - name: Toolchain doctor (strict)
        run: ./polyglot doctor --strict

      - name: Run Python integration tests
        run: python3 test_comprehensive.py

      - name: Run benchmarks
        run: python3 benchmark.py

  # ------------------------------------------------------------------ Rust --
  # The workspace has no external system-library dependencies: everything
  # is a strict gate.
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # clang/llvm on PATH: the native-backend smoke test emits objects via
      # `llc` and links with the system `cc`.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 llvm-17 lld-17

      - name: Prepend LLVM 17 bin dir to PATH
        run: echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build native driver (release)
        run: cargo build --release -p polyglot-driver

      - name: Native backend smoke test
        run: |
          ./target/release/polyglot-driver build examples/01_hello.c -o /tmp/hello --backend native
          /tmp/hello

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Check rustdoc documentation
        continue-on-error: true
        run: cargo doc --workspace --no-deps --document-private-items

  # Rust Binaries: both binaries are strict (no MLIR anywhere anymore).
  rust-binaries:
    name: Rust Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Build binaries
        run: |
          cargo build --release -p polyglot-driver
          cargo build --release -p polyglot-clang

      - name: Upload driver binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-driver-linux-x86_64
          path: target/release/polyglot-driver
          if-no-files-found: warn

  # ----------------------------------------------------------------- Audit --
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audits the root Cargo.lock, which covers the whole workspace.
      - name: Run cargo audit
        run: cargo audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python3 -m pip install pip-audit

      # Tolerated: the driver ships pyproject.toml now, but pip-audit still
      # has no locked manifest to check against.
      - name: Run pip-audit (tolerated)
        continue-on-error: true
        run: pip-audit

  # ------------------------------------------------------------------ Docs --
  # The docs site (mkdocs + material) must build warning-free.
  docs-build:
    name: Docs Build (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history: git-revision-date-localized needs commit dates
          # (enable_creation_date) and warns — fatal under --strict — when
          # history is missing.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The plugin list mirrors mkdocs.yml's `plugins:`; anything declared
      # there but not installed aborts the build.
      - name: Install mkdocs
        run: python3 -m pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir /tmp/site

  # Docs sanity checks: required files exist, markdown links resolve.
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check README exists
        run: test -f README.md

      - name: Check CONTRIBUTING exists
        run: test -f CONTRIBUTING.md

      - name: Check LICENSE exists
        run: test -f LICENSE

      - name: Check CHANGELOG exists
        run: test -f CHANGELOG.md

      - name: Check SECURITY exists
        run: test -f SECURITY.md

      - name: Check CODE_OF_CONDUCT exists
        run: test -f CODE_OF_CONDUCT.md

      - name: Validate markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check.config.json'

  # ----------------------------------------------------------- Pages deploy --
  # Publish the site on every push to master once the strict build passes.
  docs-deploy:
    name: Deploy Docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: python3 -m pip install mkdocs mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin

      - name: Build docs
        run: mkdocs build --strict --site-dir site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
