name: CI

# master is the default branch; main/develop are kept so both naming
# conventions are covered. workflow_dispatch allows manual runs.
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- Python --
  # Single-file driver `polyglot` + the comprehensive integration suite.
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # rustc is one of the components `polyglot doctor --strict` audits.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-17 clang-format-17 clang-tidy-17 \
            llvm-17 lld-17

      # The driver self-discovers toolchains here (clang, opt, llc, lli,
      # llvm-mca, wasm-ld, ... all live in this dir on Debian/Ubuntu).
      - name: Prepend LLVM 17 bin dir to PATH
        run: echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: python3 -m pip install toml pytest

      - name: Make polyglot executable
        run: chmod +x polyglot

      - name: Toolchain doctor (strict)
        run: ./polyglot doctor --strict

      - name: Run Python integration tests
        run: python3 test_comprehensive.py

      - name: Run benchmarks
        run: python3 benchmark.py

  # ------------------------------------------------------------------ Rust --
  # Pure-Rust crates are a hard gate; the MLIR crates are best-effort because
  # Ubuntu's llvm-17 packaging may differ from the developer-local LLVM the
  # crates were built against.
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    env:
      # Let mlir-sys / bindgen find Ubuntu's LLVM 17 MLIR bits. These also
      # override the developer-local defaults in .cargo/config.toml (a plain
      # [env] entry never overrides variables already set in the environment).
      MLIR_SYS_220_PREFIX: '/usr/lib/llvm-17'
      BINDGEN_EXTRA_CLANG_ARGS: '-I/usr/lib/llvm-17/lib/clang/17/include'
      LIBCLANG_PATH: '/usr/lib/llvm-17/lib'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzstd-dev libtinfo-dev libxml2-dev \
            clang-17 llvm-17 lld-17 \
            llvm-17-dev libmlir-17-dev libclang-17-dev

      - name: Prepend LLVM 17 bin dir to PATH
        run: echo "/usr/lib/llvm-17/bin" >> "$GITHUB_PATH"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Strict gates: the tree is clippy-clean and fmt-clean as of 0.2.0.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The driver (polyglot-driver + polyglot-ir/codegen) is MLIR-free:
      # codegen needs only std, so this must succeed without any MLIR
      # toolchain. Strict gate.
      - name: Build native driver (release)
        run: cargo build --release -p polyglot-driver

      # Compile-and-run smoke test through the native (Cranelift) backend.
      - name: Native backend smoke test
        run: |
          ./target/release/polyglot-driver build examples/01_hello.c -o /tmp/hello --backend native
          /tmp/hello

      # Full workspace: strict on the pure-Rust crates. If the failure is
      # caused by the MLIR crates' build against Ubuntu's packaging, warn and
      # retry without them instead of failing the job.
      - name: Run workspace tests (MLIR crates best-effort)
        run: |
          set -o pipefail
          if cargo test --workspace 2>&1 | tee /tmp/cargo-test.log; then
            echo "Full workspace test suite passed (MLIR crates included)."
            exit 0
          fi
          if grep -qiE 'mlir|bindgen' /tmp/cargo-test.log; then
            echo "::warning::cargo test --workspace failed while building the MLIR crates (polyglot-mlir / polyglot-codegen) against Ubuntu's LLVM/MLIR packaging. Retrying without them; the pure-Rust crates remain a hard gate."
            cargo test --workspace --exclude polyglot-mlir --exclude polyglot-codegen
          else
            echo "Workspace tests failed for a non-MLIR reason."
            exit 1
          fi

      - name: Check rustdoc documentation
        continue-on-error: true
        run: cargo doc --workspace --no-deps --document-private-items

  # Rust Binaries: the native driver must build; the MLIR plugin is
  # best-effort. The driver binary is uploaded as a workflow artifact.
  rust-binaries:
    name: Rust Binaries
    runs-on: ubuntu-latest
    env:
      MLIR_SYS_220_PREFIX: '/usr/lib/llvm-17'
      BINDGEN_EXTRA_CLANG_ARGS: '-I/usr/lib/llvm-17/lib/clang/17/include'
      LIBCLANG_PATH: '/usr/lib/llvm-17/lib'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzstd-dev libtinfo-dev libxml2-dev \
            clang-17 llvm-17 lld-17 \
            llvm-17-dev libmlir-17-dev libclang-17-dev

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Build native driver binary
        run: cargo build --release -p polyglot-driver

      - name: Build MLIR plugin binary (best-effort)
        id: mlir_plugin
        continue-on-error: true
        run: cargo build --release -p polyglot-clang

      - name: MLIR plugin note
        if: steps.mlir_plugin.outcome == 'failure'
        run: echo "::warning::polyglot-clang (MLIR-dependent) failed to build against Ubuntu's LLVM/MLIR packaging; it is omitted from the artifacts."

      - name: Upload driver binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-driver-linux-x86_64
          path: target/release/polyglot-driver
          if-no-files-found: warn

  # ----------------------------------------------------------------- Audit --
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audits the root Cargo.lock, which covers the whole workspace.
      - name: Run cargo audit
        run: cargo audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python3 -m pip install pip-audit

      # Tolerated for now: the Python driver is a single file and the repo
      # ships no requirements.txt, so pip-audit has no manifest to check.
      - name: Run pip-audit (tolerated)
        continue-on-error: true
        run: pip-audit

  # ------------------------------------------------------------------ Docs --
  # The docs site (mkdocs + material) must build warning-free.
  docs-build:
    name: Docs Build (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mkdocs
        run: python3 -m pip install mkdocs mkdocs-material

      - name: Build docs (strict)
        run: mkdocs build --strict --site-dir /tmp/site

  # Docs sanity checks: required files exist, markdown links resolve.
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README exists
        run: test -f README.md

      - name: Check CONTRIBUTING exists
        run: test -f CONTRIBUTING.md

      - name: Check LICENSE exists
        run: test -f LICENSE

      - name: Check CHANGELOG exists
        run: test -f CHANGELOG.md

      - name: Check SECURITY exists
        run: test -f SECURITY.md

      - name: Check CODE_OF_CONDUCT exists
        run: test -f CODE_OF_CONDUCT.md

      - name: Validate markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: '.github/markdown-link-check.config.json'

  # --------------------------------------------------------------- Release --
  release:
    name: Release
    needs: [python-tests, rust-tests, security-audit, docs-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MLIR_SYS_220_PREFIX: '/usr/lib/llvm-17'
      BINDGEN_EXTRA_CLANG_ARGS: '-I/usr/lib/llvm-17/lib/clang/17/include'
      LIBCLANG_PATH: '/usr/lib/llvm-17/lib'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libzstd-dev libtinfo-dev libxml2-dev \
            clang-17 llvm-17 lld-17 \
            llvm-17-dev libmlir-17-dev libclang-17-dev

      - name: Build release binaries
        run: |
          # Native driver: MLIR-free build, must succeed.
          cargo build --release -p polyglot-driver
          # MLIR-dependent plugin is best-effort.
          cargo build --release -p polyglot-clang || \
            echo "::warning::polyglot-clang (MLIR) build failed; release archive will omit it."

      - name: Create release archives
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p release
          # Python driver release
          cp polyglot release/polyglot
          chmod +x release/polyglot
          # Native driver binary (MLIR-free build)
          if [ -f target/release/polyglot-driver ]; then
            cp target/release/polyglot-driver release/
          fi
          # MLIR plugin binary when it built
          if [ -f target/release/polyglot-clang ]; then
            cp target/release/polyglot-clang release/
          fi
          tar -czf "polyglot-${VERSION}-linux-x86_64.tar.gz" -C release .
          ls -la release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            polyglot-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
