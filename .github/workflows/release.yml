name: Release

# Tag a version (v*) to build and publish. The Rust binaries are
# dependency-free (no openssl/tls anywhere), so cargo-zigbuild covers
# Linux and Windows cleanly; macOS builds natively with a universal2
# lipo step. The Python driver ships as its own source archive: it is
# one `pipx install` away and needs no binary.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------ prep --
  # Version consistency gate + the Python driver archive.
  prep:
    name: Prep (version gate + python archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version gate
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$VERSION\"" Cargo.toml || {
            echo "::error::Cargo.toml workspace version is not $VERSION"; exit 1; }
          grep -q "^VERSION = \"$VERSION\"" polyglot_lib/__init__.py || {
            echo "::error::polyglot_lib VERSION is not $VERSION"; exit 1; }
          grep -q "## \[$VERSION\]" CHANGELOG.md || {
            echo "::warning::CHANGELOG.md has no [$VERSION] entry"; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stage and pack the Python driver archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          stage="polyglot-$VERSION-python"
          mkdir "$stage"
          cp polyglot "$stage/"
          cp -r polyglot_lib "$stage/"
          rm -rf "$stage"/polyglot_lib/__pycache__ "$stage"/polyglot_lib/commands/__pycache__
          cp pyproject.toml README.md LICENSE CHANGELOG.md "$stage/"
          mkdir dist
          python3 scripts/package_release.py "dist/$stage.tar.gz" "$stage"

      - name: Smoke the staged launcher
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -tzf "dist/polyglot-$VERSION-python.tar.gz" | head -5
          chmod +x polyglot
          ./polyglot version | grep -q "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  # --------------------------------------------------------------- linux/win --
  zigbuild:
    name: ${{ matrix.target }}
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
          - target: armv7-unknown-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: s390x-unknown-linux-gnu
          - target: loongarch64-unknown-linux-gnu
          - target: x86_64-pc-windows-gnu
          - target: aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild and zig
        run: pip3 install cargo-zigbuild "ziglang==0.14.1"

      - name: Build binaries
        run: cargo zigbuild --release -p polyglot-driver -p polyglot-clang --target ${{ matrix.target }}

      - name: Stage and pack
        shell: python
        run: |
          import os, pathlib, subprocess, sys, tarfile, zipfile
          version = os.environ["GITHUB_REF_NAME"][1:]
          target = "${{ matrix.target }}"
          root = pathlib.Path.cwd()
          stage = pathlib.Path(f"polyglot-{version}-{target}")
          stage.mkdir()
          for b in ("polyglot-driver", "polyglot-clang"):
              src = root / "target" / target / "release" / b
              if target.endswith("windows-gnu") or target.endswith("windows-gnullvm"):
                  src = src.with_suffix(".exe")
              if not src.exists():
                  sys.exit(f"missing binary {src}")
              (stage / src.name).write_bytes(src.read_bytes())
              (stage / src.name).chmod(0o755)
          for doc in ("README.md", "LICENSE"):
              (stage / doc).write_bytes((root / doc).read_bytes())
          arc = root / f"dist-polyglot-{version}-{target}"
          arc.mkdir()
          if target.endswith("windows-gnu") or target.endswith("windows-gnullvm"):
              zp = arc / f"{stage.name}.zip"
              with zipfile.ZipFile(zp, "w", zipfile.ZIP_DEFLATED) as zf:
                  for f in sorted(stage.rglob("*")):
                      zf.write(f, f"{stage.name}/{f.relative_to(stage)}")
          else:
              subprocess.run(["python3", "scripts/package_release.py",
                              str(arc / f"{stage.name}.tar.gz"), stage.name],
                             check=True)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-polyglot-${{ github.ref_name }}-${{ matrix.target }}
          path: dist-polyglot-*/

  # ----------------------------------------------------------------- macos --
  macos:
    name: macos (${{ matrix.target }})
    needs: prep
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release -p polyglot-driver -p polyglot-clang --target ${{ matrix.target }}

      - name: Stage and pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARGET="${{ matrix.target }}"
          stage="polyglot-$VERSION-$TARGET"
          mkdir "$stage"
          cp target/$TARGET/release/polyglot-driver target/$TARGET/release/polyglot-clang "$stage/"
          cp README.md LICENSE "$stage/"
          mkdir dist-$stage
          python3 scripts/package_release.py "dist-$stage/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-polyglot-${{ github.ref_name }}-${{ matrix.target }}
          path: dist-*/

  # -------------------------------------------------------------- universal --
  macos-universal:
    name: macos (universal2)
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build both slices and lipo
        run: |
          cargo build --release -p polyglot-driver -p polyglot-clang --target aarch64-apple-darwin
          cargo build --release -p polyglot-driver -p polyglot-clang --target x86_64-apple-darwin
          VERSION="${GITHUB_REF_NAME#v}"
          stage="polyglot-$VERSION-universal2-apple-darwin"
          mkdir "$stage"
          for b in polyglot-driver polyglot-clang; do
            lipo -create \
              target/aarch64-apple-darwin/release/$b \
              target/x86_64-apple-darwin/release/$b \
              -output "$stage/$b"
          done
          cp README.md LICENSE "$stage/"
          mkdir dist-$stage
          python3 scripts/package_release.py "dist-$stage/$stage.tar.gz" "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-polyglot-${{ github.ref_name }}-universal2-apple-darwin
          path: dist-*/

  # --------------------------------------------------------------- publish --
  publish:
    name: Publish release
    needs: [prep, zigbuild, macos, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      # Each build artifact carries its own dist-polyglot-*/ directory;
      # merge-multiple keeps that level, so lift the archives to dist/.
      - name: Flatten artifact directories
        run: |
          find dist -mindepth 2 \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete

      - name: Verify and checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ls -la dist/
          # every archive must unpack with the staged name and run --version
          cd dist
          find . -name "*.tar.gz" -maxdepth 1 | while read -r t; do
            base=$(basename "$t" .tar.gz)
            tmp=$(mktemp -d)
            tar -xzf "$t" -C "$tmp"
            if [ "${base#polyglot-$VERSION-python}" = "$base" ]; then
              b="$tmp/$base/polyglot-driver"
              chmod +x "$b"
              "$b" --version | grep -q "$VERSION" || { echo "::error::$base: bad --version"; exit 1; }
              [ -x "$tmp/$base/polyglot-clang" ] || { echo "::error::$base: missing polyglot-clang"; exit 1; }
            else
              grep -q "^VERSION = \"$VERSION\"" "$tmp/$base/polyglot_lib/__init__.py" \
                || { echo "::error::$base: python archive wrong version"; exit 1; }
            fi
            rm -rf "$tmp"
          done
          sha256sum polyglot-$VERSION-* > sha256sums.txt

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(version)}\].*?\n(.*?)(?=^## \[|^<div|\Z)", text, re.S | re.M)
          if not m:
              open("/tmp/body.md", "w").write(f"polyglot {version}\n")
          else:
              open("/tmp/body.md", "w").write(m.group(1).strip() + "\n")
          PY

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/polyglot-*
            dist/sha256sums.txt
          body_path: /tmp/body.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
